name: qestak
description: "قسطك | Qestak - Multi-Creditor Installment Tracking App"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase — compatible set
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.0

  # State Management
  provider: ^6.1.1

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0

  # Utilities
  intl: 0.20.2
  path_provider: ^2.1.2
  share_plus: ^7.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  uuid: ^4.3.3
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0
  excel: ^4.0.3
  csv: ^6.0.0
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
